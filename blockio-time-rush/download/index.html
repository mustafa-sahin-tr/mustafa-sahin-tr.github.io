<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blockio: Block Puzzle Game</title>
<meta name="description" content="Relaxing block puzzle: clear lines, build landmarks. Free on the App Store and Google Play.">
<meta property="og:title" content="Blockio: Block Puzzle Game">
<meta property="og:description" content="Relaxing block puzzle: clear lines, build landmarks.">
<meta property="og:image" content="https://mustafa-sahin-tr.github.io/games-catalog-icons/blockio.png">
<style>
:root{--bg:#2f6fd6;--ink:#fff;--muted:#dbe7ff;--card:#fff;--card-ink:#1d2a44}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;margin:0 auto;padding:48px 16px 64px;text-align:center}
img.icon{width:120px;height:120px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
h1{font-size:28px;margin:20px 0 4px}
p{margin:0 0 28px;color:var(--muted)}
a.store{display:block;margin:12px 0;padding:16px;border-radius:14px;background:var(--card);color:var(--card-ink);font-weight:700;font-size:18px;text-decoration:none}
.hint{font-size:14px;color:var(--muted);min-height:1.5em}
</style>
</head>
<body>
<main>
<img class="icon" src="/games-catalog-icons/blockio.png" alt="">
<h1>Blockio</h1>
<p id="lead">Relaxing block puzzle: clear lines, build landmarks.</p>
<a class="store" id="ios" href="https://apps.apple.com/app/id6819092132">App Store</a>
<a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.mtafasahin.blockiotimerush">Google Play</a>
<div class="hint" id="hint"></div>
</main>
<script>
// One link for Instagram stories, Reels captions and the profile bio: iOS goes to the App Store, Android to Google
// Play, anything else sees both buttons. ?s=story|reels|bio tags the visit so the stores' reports show where
// installs came from (Play: utm referrer, App Store: campaign token).
(function () {
  var TEXT = {
    tr: { lead: "Rahatlatıcı blok bulmaca: satırları temizle, maket kur.", hint: "Mağaza açılıyor…" },
    en: { lead: "Relaxing block puzzle: clear lines, build landmarks.", hint: "Opening the store…" }
  };
  var lang = (navigator.language || "en").toLowerCase().indexOf("tr") === 0 ? "tr" : "en";
  document.documentElement.lang = lang;
  document.getElementById("lead").textContent = TEXT[lang].lead;

  var source = (new URLSearchParams(location.search).get("s") || "instagram").replace(/[^a-z0-9_-]/gi, "").slice(0, 30);
  var ios = document.getElementById("ios");
  var android = document.getElementById("android");
  ios.href += "?ct=" + encodeURIComponent(source);
  android.href += "&referrer=" + encodeURIComponent("utm_source=instagram&utm_medium=" + source);

  var ua = navigator.userAgent || "";
  var isIos = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var store = isIos ? ios.href : isAndroid ? android.href : null;
  if (store) {
    (isIos ? android : ios).style.display = "none";
    document.getElementById("hint").textContent = TEXT[lang].hint;
    location.replace(store);
  }
})();
</script>
</body>
</html>
